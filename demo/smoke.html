<!-- better-tracking (debug build: rich console output) -->
<script>window.bt=window.bt||function(){(bt.q=bt.q||[]).push(arguments)}</script>
<script src="../dist/bt.debug.js" defer></script>
<script>
bt('configure', {
  // X + LinkedIn conversions need account-specific ids:
  map: { purchase: { x: 'REPLACE_ME_TW_EVENT_ID', linkedin: 'REPLACE_ME_LI_CONVERSION_ID' } },
  // relay: '/api/events',  // uncomment to smoke-test the server relay too
});
bt('on', 'dispatch', (d) => console.log('dispatch', d));
</script>

<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  button { display: block; width: 100%; margin: .5rem 0; padding: .75rem; font-size: 1rem; cursor: pointer; }
  code { background: #eee; padding: .1em .3em; border-radius: 3px; }
</style>
</head>
<body>
<h1>better-tracking smoke page</h1>
<p>Open the console (debug build logs a dispatch table) and each vendor's pixel-helper extension, then fire events:</p>

<button onclick="bt('track','view_item',{items:[{id:'sku1',name:'Widget',price:49.99,quantity:1}]})">view_item</button>
<button onclick="bt('track','search',{query:'widgets'})">search</button>
<button onclick="bt('track','add_to_cart',{value:49.99,currency:'USD',items:[{id:'sku1',price:49.99,quantity:1}]})">add_to_cart</button>
<button onclick="bt('track','begin_checkout',{value:49.99,currency:'USD'})">begin_checkout</button>
<button onclick="bt('track','purchase',{value:49.99,currency:'USD',items:[{id:'sku1',price:49.99,quantity:1}],transaction_id:'T-1001'})">purchase</button>
<button onclick="bt('track','sign_up',{method:'email'})">sign_up</button>
<button onclick="bt('track','generate_lead',{value:10,currency:'USD'})">generate_lead</button>
<button onclick="bt('track','demo_booked',{plan:'pro'})">demo_booked (custom)</button>
<button onclick="bt('page',{path:'/smoke',title:'Smoke'})">page()</button>
<button onclick="bt('identify',{email:'test@example.com',user_id:'u-1'})">identify()</button>

<p>Detected vendors: <code id="detected">(none yet)</code></p>
<script>
const found = [];
bt('on', 'detect', ({ vendor }) => {
  found.push(vendor);
  document.getElementById('detected').textContent = found.join(', ');
});
</script>
</body>
