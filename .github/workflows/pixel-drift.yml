# Weekly run of the Playwright integration matrix against the real vendor
# paste-in snippets (PRD §9): catches vendor snippet/global drift that unit
# tests with faked globals cannot.
name: Pixel drift (weekly)

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
